<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rack &amp; HRT">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e0761f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="box">
  <h1 id="title">Sign in</h1>
  <p class="sub" id="sub">Rack Builder and HRT Log share this login.</p>
  <form id="auth" method="post" action="/login.html" autocomplete="on">
    <label>Username<input id="u" name="username" autocomplete="username" required autofocus></label>
    <label>Password<span class="hint" id="hint" hidden> 10+ characters</span><input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label id="coderow" hidden>Setup code<span class="hint"> from the container log</span><input id="code" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <label id="p2row" hidden>Confirm password<input id="p2" type="password" autocomplete="new-password"></label>
    <p class="err" id="err" role="alert"></p>
    <button type="submit" id="go">Sign in</button>
  </form>
</main>
<script src="/login.js"></script>
</body>
</html>
