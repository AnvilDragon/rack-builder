name: Test image
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Syntax check
        run: |
          for f in server.js public/*.js public/rack/*.js public/hrt/*.js; do node --check "$f"; done

      - name: Sign-in form must never put credentials in the URL
        run: grep -q "<form id=\"auth\" method=\"post\"" public/login.html

      - name: Build image
        run: docker build -t rack-builder:test .

      - name: Run it like TrueNAS does (user 568, read-only, no extra permissions)
        run: |
          mkdir data && sudo chown 568:568 data
          docker run -d --name rb -p 8080:8080 --user 568:568 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD/data:/data" \
            -e SETUP_CODE=ci-setup-code -e FIRST_USER=ci-user rack-builder:test
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz

      - name: Smoke test
        run: |
          set -eu
          B=http://localhost:8080
          J='Content-Type: application/json'
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          must() { if ! bash -c "$1" >/dev/null 2>&1; then echo "FAIL $2"; docker logs rb | tail -30; exit 1; fi; echo "ok   $2"; }
          expect() { [ "$1" = "$2" ] || { echo "FAIL $3: got $1, want $2"; docker logs rb | tail -30; exit 1; }; echo "ok   $3"; }

          expect "$(code $B/)" 302 "signed-out / redirects to login"
          expect "$(code $B/rack/)" 302 "signed-out /rack/ redirects"
          expect "$(code $B/login.html)" 200 "login page is public"
          expect "$(code $B/manifest.webmanifest)" 200 "manifest is public"
          expect "$(code $B/icons/icon-180.png)" 200 "icon is public"
          expect "$(code $B/rack/api/live)" 401 "signed-out rack api blocked"
          expect "$(code $B/hrt/api/state)" 401 "signed-out hrt api blocked"
          expect "$(code $B/server.js)" 302 "source not served"

          expect "$(code -X POST $B/api/auth/setup -H "$J" -d '{"username":"ci-user","password":"correct horse battery","code":"wrong"}')" 403 "setup rejects wrong code"
          expect "$(code -X POST $B/api/auth/setup -H "$J" -d '{"username":"someone-else","password":"correct horse battery","code":"ci-setup-code"}')" 403 "setup rejects wrong username"
          expect "$(code -X POST $B/api/auth/setup -H 'Content-Type: text/plain' -d 'x')" 415 "setup needs json"

          curl -s -c jar -o /dev/null -w '%{http_code}\n' -X POST $B/api/auth/setup -H "$J" \
            -d '{"username":"CI-User","password":"correct horse battery","code":"ci-setup-code"}' | grep -qx 200
          echo "ok   setup succeeds with right username and code"
          grep -q 'HttpOnly' jar || grep -q hrt jar
          expect "$(code -X POST $B/api/auth/setup -H "$J" -d '{"username":"x","password":"correct horse battery","code":"ci-setup-code"}')" 409 "setup closed after first account"

          expect "$(code -b jar $B/rack/)" 200 "/rack/ loads when signed in"
          expect "$(code -b jar $B/hrt/)" 200 "/hrt/ loads when signed in"
          expect "$(code -b jar $B/rack/rack.js)" 200 "rack.js loads"
          expect "$(code -b jar $B/hrt/app.js)" 200 "hrt app.js loads"
          expect "$(code -b jar $B/rack/api/ping)" 200 "rack ping"
          expect "$(code -b jar $B/rack/api/live)" 200 "rack live"
          expect "$(code -b jar $B/rack/api/live/history)" 200 "rack live history"
          if curl -s -b jar $B/rack/api/live | grep -q '"hist"'; then echo "FAIL /rack/api/live still carries per-app hist on every poll (the bandwidth fix regressed)"; exit 1; fi
          echo "ok   /rack/api/live carries no per-app history (client builds its own)"
          expect "$(code -b jar $B/rack/api/state)" 200 "rack state"

          # Rack Builder document save round trip
          expect "$(code -b jar -X PUT $B/rack/api/doc/settings/budget -H "$J" -d '{"perCheck":70}')" 200 "rack doc save"
          curl -s -b jar $B/rack/api/state | grep -q '"perCheck":70'
          echo "ok   rack doc persisted"

          # HRT log round trip (rev check, save, malformed save rejected, exports)
          REV=$(curl -s -b jar $B/hrt/api/state | sed 's/.*"rev":\([0-9]*\).*/\1/')
          expect "$(code -b jar -X PUT $B/hrt/api/state -H "$J" -d "{\"rev\":$REV}")" 400 "malformed hrt save rejected"
          expect "$(code -b jar -X PUT $B/hrt/api/state -H "$J" -d "{\"rev\":$REV,\"state\":{\"start\":\"2026-01-01\",\"shots\":[{\"date\":\"2026-01-01\",\"ml\":0.1,\"site\":\"Thigh\"}]}}")" 200 "hrt save"
          expect "$(code -b jar -X PUT $B/hrt/api/state -H "$J" -d "{\"rev\":$REV,\"state\":{}}")" 409 "stale hrt save rejected"
          expect "$(code -b jar "$B/hrt/api/export?format=csv")" 200 "csv export"
          expect "$(code -b jar "$B/hrt/api/export?format=json")" 200 "json export"
          curl -s -b jar -o backup.db "$B/hrt/api/export?format=sqlite"
          if [ "$(head -c 15 backup.db)" != "SQLite format 3" ]; then echo "FAIL sqlite export is not a database"; exit 1; fi; echo "ok   sqlite export is a database"
          if grep -a -q "scrypt" backup.db; then echo "FAIL sqlite export contains the password hash"; exit 1; fi; echo "ok   sqlite export has no password hash"

          # Wrong password / lockout
          expect "$(code -X POST $B/api/auth/login -H "$J" -d '{"username":"ci-user","password":"nope-nope-nope"}')" 401 "wrong password rejected"

          # Sign out ends the session
          expect "$(code -b jar -c jar -X POST $B/api/auth/logout -H "$J" -d '{}')" 200 "logout"
          expect "$(code -b jar $B/hrt/api/state)" 401 "session dead after logout"
          expect "$(code -c jar2 -X POST $B/api/auth/login -H "$J" -d '{"username":"ci-user","password":"correct horse battery"}')" 200 "login works"
          expect "$(code -b jar2 $B/hrt/)" 200 "signed in again"

          # Data lives on the volume, not in the image
          must "test -f data/hrt.db && test -f data/state.json" "data written to the mounted volume"

          # Security headers and cookie flags
          H=$(curl -sI $B/login.html)
          printf '%s' "$H" > headers.txt; must "grep -qiE '^content-security-policy:.*script-src .self.' headers.txt" "CSP restricts scripts to same origin"
          if echo "$H" | grep -i '^content-security-policy:' | grep -qiE 'googleapis|gstatic|https?://'; then echo "FAIL CSP allows a third-party origin"; exit 1; fi; echo "ok   CSP allows no third-party origin"
          must "grep -qi '^x-content-type-options: nosniff' headers.txt" "nosniff"
          must "grep -qi '^referrer-policy: no-referrer' headers.txt" "no referrer sent"
          must "grep -qi '^x-frame-options: deny' headers.txt" "clickjacking blocked"
          curl -si -X POST $B/api/auth/login -H "$J" -d '{"username":"ci-user","password":"correct horse battery"}' | grep -i '^set-cookie:' > cookie.txt
          must "grep -qi HttpOnly cookie.txt && grep -qi SameSite=Strict cookie.txt" "session cookie is HttpOnly + SameSite=Strict"
          expect "$(curl -s -o /dev/null -w '%{http_code}' -b jar2 -X POST $B/api/auth/logout -H "$J" -H 'Origin: http://evil.example' -d '{}')" 403 "cross-site POST rejected"
          expect "$(code -b jar2 "$B/hrt/api/export?format=json")" 200 "export works when signed in"
          expect "$(code "$B/hrt/api/export?format=json")" 401 "export blocked when signed out"

          # No third-party resources in any page
          if grep -rEn '<(link|script|img|iframe)[^>]*(src|href)=.?https?://' public --include=*.html; then echo "FAIL a page loads a third-party resource"; exit 1; fi
          echo "ok   pages load nothing from third parties"

          # Lockout: five wrong passwords lock sign-in, even for the right password
          for i in 1 2 3 4 5; do code -X POST $B/api/auth/login -H "$J" -d '{"username":"ci-user","password":"wrong-wrong-wrong"}' > /dev/null; done
          expect "$(code -X POST $B/api/auth/login -H "$J" -d '{"username":"ci-user","password":"correct horse battery"}')" 429 "sign-in locked after repeated failures"

      - name: Container log
        if: always()
        run: docker logs rb || true

  attack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image
        run: docker build -t rack-builder:test .

      - name: Run it like TrueNAS does (user 568, read-only, no extra permissions)
        run: |
          mkdir data && sudo chown 568:568 data
          docker run -d --name rb -p 8080:8080 --user 568:568 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD/data:/data" \
            -e SETUP_CODE=attack-setup-code -e FIRST_USER=attacker-target rack-builder:test
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/healthz

      # One real account, used only where a test needs an authenticated session.
      - name: Create the one real account
        run: |
          curl -s -c jar -o /dev/null -X POST http://localhost:8080/api/auth/setup -H 'Content-Type: application/json' \
            -d '{"username":"attacker-target","password":"the real password 123","code":"attack-setup-code"}'
          curl -s -b jar http://localhost:8080/hrt/ -o /dev/null -w '%{http_code}\n' | grep -qx 200

      - name: Attack — reach every protected route with no credentials at all
        run: |
          set -eu
          B=http://localhost:8080
          fail=0
          probe() { c=$(curl -s -o /tmp/body -w '%{http_code}' "$@"); echo "$c $*"; }
          # Every route that must require a session, hit with zero cookie and zero header.
          for ep in "/rack/api/state" "/rack/api/live" "/rack/api/ping" "/hrt/api/state" \
                    "/hrt/api/export?format=json" "/hrt/api/export?format=csv" "/hrt/api/export?format=sqlite" \
                    "/rack/" "/hrt/" "/rack/index.html" "/hrt/index.html" "/rack/rack.js" "/hrt/app.js"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' "$B$ep")
            case "$c" in 401|302) echo "ok   blocked with no cookie: $ep ($c)";; *) echo "FAIL reachable with no cookie: $ep ($c)"; fail=1;; esac
          done
          # Same routes with method games and no credentials — must not accidentally authorize or leak.
          for m in HEAD OPTIONS TRACE PATCH DELETE; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X "$m" "$B/hrt/api/state")
            case "$c" in 401|302|404|405|415) echo "ok   $m with no cookie blocked ($c)";; *) echo "FAIL $m with no cookie returned $c"; fail=1;; esac
          done
          # Forged / garbage / empty / oversized session cookies — none may authenticate.
          for cookie in "hrt=garbage-token-not-a-real-session" "hrt=" "hrt=0" \
                        "hrt=$(head -c 2000 </dev/zero | tr '\0' 'a')" \
                        "hrt='; DROP TABLE session;--" "hrt=../../../etc/passwd"; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Cookie: $cookie" "$B/hrt/api/state")
            case "$c" in 401) echo "ok   forged cookie rejected: ${cookie:0:30}... ($c)";; *) echo "FAIL forged cookie accepted: ${cookie:0:40} -> $c"; fail=1;; esac
          done
          exit $fail

      - name: Attack — brute-force the first-time setup gate on a clean instance
        run: |
          set -eu
          mkdir -p data2; sudo chown 568:568 data2
          docker run -d --name rb2 -p 8081:8080 --user 568:568 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD/data2:/data" \
            -e SETUP_CODE=the-real-code-nobody-knows -e FIRST_USER=realuser rack-builder:test
          for i in $(seq 1 30); do curl -sf localhost:8081/healthz && break; sleep 1; done
          fail=0; saw_lockout=0
          # Try to claim the account with guessed codes. None may succeed (200), and the
          # lockout (429) must kick in at some point — it's meant to trigger at 5 failures.
          for guess in 000000 aaaaaa 123456 letmein codecode wrongwrongwrong qwerty12 attacker1 setupcode 000001; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/auth/setup -H 'Content-Type: application/json' \
              -d "{\"username\":\"realuser\",\"password\":\"attacker chosen password\",\"code\":\"$guess\"}")
            case "$c" in
              403) ;; # wrong code, not yet locked — expected
              429) saw_lockout=1 ;; # locked out — expected once the threshold is hit
              *) echo "FAIL guess '$guess' got unexpected status $c (want 403 or 429)"; fail=1 ;;
            esac
          done
          [ "$saw_lockout" = "1" ] && echo "ok   repeated wrong setup codes triggered the lockout" || { echo "FAIL lockout never triggered across 10 wrong guesses"; fail=1; }
          # Once locked, even the real code must be rejected until the lockout expires.
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/auth/setup -H 'Content-Type: application/json' \
            -d '{"username":"realuser","password":"attacker chosen password","code":"the-real-code-nobody-knows"}')
          [ "$c" = "429" ] && echo "ok   setup still locked, right code also rejected right now" || { echo "FAIL setup not locked after repeated failures, got $c"; fail=1; }
          # The real owner can still claim it after confirming no account was created by the attacker.
          c=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/auth/status)
          curl -s http://localhost:8081/api/auth/status | grep -q '"setup":false' && echo "ok   no account was created by the attack" || { echo "FAIL an account exists after the attack"; fail=1; }
          docker logs rb2 | tail -20
          exit $fail

      - name: Attack — path traversal against the static file server (as a signed-in user)
        run: |
          set -eu
          B=http://localhost:8080
          fail=0
          for p in "/../server.js" "/../../server.js" "/../package.json" "/rack/../../server.js" \
                   "/icons/../../server.js" "/%2e%2e/server.js" "/%2e%2e%2fserver.js" "/..%2fserver.js" \
                   "/..%5cserver.js" "//server.js" "/./../server.js" "/rack/..%2f..%2fserver.js" \
                   "/../Dockerfile" "/../.github/workflows/docker.yml" "/../compose.yaml" "/../.git/config" \
                   "/../../../../../../etc/passwd" "/hrt/..%2f..%2fserver.js"; do
            body=$(curl -s -b jar "$B$p")
            c=$(curl -s -o /dev/null -w '%{http_code}' -b jar "$B$p")
            if printf '%s' "$body" | grep -qE 'createServer|require\(.node:|scryptSync|root:x:0:0'; then
              echo "FAIL traversal served real file content: $p ($c)"; fail=1
            else
              echo "ok   traversal blocked: $p ($c)"
            fi
          done
          exit $fail

      - name: Attack — prototype pollution via the Rack Builder document store
        run: |
          set -eu
          B=http://localhost:8080
          fail=0
          # Try to pollute Object.prototype through the one endpoint that stores a raw parsed object.
          curl -s -b jar -o /dev/null -X PUT "$B/rack/api/doc/attack/x" -H 'Content-Type: application/json' \
            -d '{"__proto__":{"polluted_marker":"yes"},"a":1}'
          curl -s -b jar -o /dev/null -X PUT "$B/rack/api/doc/attack/y" -H 'Content-Type: application/json' \
            -d '{"constructor":{"prototype":{"polluted_marker2":"yes"}}}'
          # If Object.prototype were polluted, it would leak into the unrelated 'ver' wrapper
          # and into a brand-new doc that never set this field, since JSON.stringify serializes
          # inherited enumerable properties placed directly on Object.prototype.
          curl -s -b jar -o /dev/null -X PUT "$B/rack/api/doc/attack/untouched" -H 'Content-Type: application/json' -d '{"b":2}'
          # The real signal is whether the marker leaks into a doc that never set it, not
          # whether it appears anywhere in the dump (attack/x legitimately contains it, since
          # we just stored it there as ordinary data under its own key).
          UNTOUCHED=$(node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(s.docs["attack/untouched"]))' < <(curl -s -b jar "$B/rack/api/state"))
          if printf '%s' "$UNTOUCHED" | grep -q 'polluted_marker'; then
            echo "FAIL prototype pollution reached an unrelated doc: $UNTOUCHED"; fail=1
          else
            echo "ok   no prototype pollution observed in an unrelated doc ($UNTOUCHED)"
          fi
          # Also check a brand-new plain object server-side would never pick this up —
          # the clearest proof is that a doc key nobody ever PUT at all comes back absent,
          # not materialized with inherited junk, when we ask for the whole state.
          NEVER_SET=$(node -e 'const s=JSON.parse(require("fs").readFileSync(0,"utf8")); process.stdout.write(JSON.stringify(s.docs["attack/never-set-this-key"] ?? null))' < <(curl -s -b jar "$B/rack/api/state"))
          [ "$NEVER_SET" = "null" ] && echo "ok   an untouched doc key stays absent, not polluted ($NEVER_SET)" || { echo "FAIL untouched doc key materialized as: $NEVER_SET"; fail=1; }
          exit $fail

      - name: Attack — malformed, oversized and adversarial JSON bodies
        run: |
          set -eu
          B=http://localhost:8080
          fail=0
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          # Non-object top-level JSON where an object is required.
          for bad in 'null' '[]' '"just a string"' '42' 'true'; do
            c=$(code -X POST "$B/api/auth/login" -H 'Content-Type: application/json' -d "$bad")
            case "$c" in 400|401) echo "ok   non-object login body handled ($bad -> $c)";; *) echo "FAIL non-object login body -> $c"; fail=1;; esac
          done
          # Deeply nested JSON (parser stress), built by plain string repetition so building the
          # fixture itself can't blow a recursive serializer the way the thing under test might.
          node -e 'const n=5000; require("fs").writeFileSync("/tmp/deep-hrt.json", "{\"rev\":0,\"state\":{\"entries\":[],\"shots\":[],\"labs\":[],\"deep\":"+"[".repeat(n)+"1"+"]".repeat(n)+"}}")'
          c=$(code -b jar -X PUT "$B/hrt/api/state" -H 'Content-Type: application/json' --data-binary @/tmp/deep-hrt.json)
          echo "deep JSON body to hrt/api/state -> $c (any non-5xx is fine; the extra 'deep' field is simply dropped)"
          curl -sf "$B/healthz" >/dev/null && echo "ok   server still alive after deep JSON" || { echo "FAIL server died after deep JSON"; fail=1; }
          # The Rack doc store keeps the raw parsed body and re-serializes it on every future
          # save and every GET /rack/api/state — a small-but-deep body there must be rejected
          # up front (400), not accepted and left to break every later read.
          node -e 'const n=5000; require("fs").writeFileSync("/tmp/deep-rack.json", "[".repeat(n)+"1"+"]".repeat(n))'
          c=$(code -b jar -X PUT "$B/rack/api/doc/attack/deep" -H 'Content-Type: application/json' --data-binary @/tmp/deep-rack.json)
          [ "$c" = "400" ] && echo "ok   deeply nested rack doc rejected up front (400)" || { echo "FAIL deeply nested rack doc -> $c (want 400, not stored)"; fail=1; }
          c=$(code -b jar "$B/rack/api/state")
          [ "$c" = "200" ] && echo "ok   /rack/api/state still readable after the attempt ($c)" || { echo "FAIL /rack/api/state broken after the attempt: $c"; fail=1; }
          # Large note field, still under the body cap.
          BIGNOTE=$(head -c 1900 </dev/zero | tr '\0' 'x')
          REV=$(curl -s -b jar "$B/hrt/api/state" | sed 's/.*"rev":\([0-9]*\).*/\1/')
          c=$(code -b jar -X PUT "$B/hrt/api/state" -H 'Content-Type: application/json' \
            -d "{\"rev\":$REV,\"state\":{\"entries\":[{\"date\":\"2026-01-01\",\"note\":\"$BIGNOTE\"}],\"shots\":[],\"labs\":[]}}")
          [ "$c" = "200" ] && echo "ok   large-but-valid note accepted ($c)" || { echo "FAIL large valid note rejected: $c"; fail=1; }
          # A moderately oversized body (over the doc endpoint's 1MB cap, well under the hard
          # cap) must get a clean 413, not a dropped connection.
          head -c 1500000 </dev/zero | tr '\0' 'a' > /tmp/over.json
          c=$(code -b jar -X PUT "$B/rack/api/doc/attack/over" -H 'Content-Type: application/json' --data-binary @/tmp/over.json)
          [ "$c" = "413" ] && echo "ok   moderately oversized body gets a clean 413, not a reset ($c)" || { echo "FAIL moderately oversized body -> $c (want a clean 413)"; fail=1; }
          # A wildly oversized body is allowed to cut the connection, but must not crash the server.
          head -c 6000000 </dev/zero | tr '\0' 'a' > /tmp/huge.json
          c=$(code -b jar -X PUT "$B/rack/api/doc/attack/huge" -H 'Content-Type: application/json' --data-binary @/tmp/huge.json) || true
          echo "huge oversized body -> $c (413 or a dropped connection are both acceptable here)"
          curl -sf "$B/healthz" >/dev/null && echo "ok   server still alive after oversized bodies" || { echo "FAIL server died after oversized body"; fail=1; }
          exit $fail

      - name: Attack — a burst of concurrent wrong-password logins must not evade the lockout
        run: |
          set -eu
          mkdir -p data3; sudo chown 568:568 data3
          docker run -d --name rb3 -p 8082:8080 --user 568:568 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true -v "$PWD/data3:/data" \
            -e SETUP_CODE=burst-setup-code -e FIRST_USER=burstuser rack-builder:test
          for i in $(seq 1 30); do curl -sf localhost:8082/healthz && break; sleep 1; done
          curl -s -o /dev/null -X POST http://localhost:8082/api/auth/setup -H 'Content-Type: application/json' \
            -d '{"username":"burstuser","password":"the real password 123","code":"burst-setup-code"}'
          # Fire 30 wrong-password logins at once, all from this one source. The lockout is
          # meant to allow 5 real attempts before locking — if the check-then-record step isn't
          # atomic with respect to concurrent requests, far more than 5 could get a genuine
          # password check (401) instead of being turned away up front (429).
          rm -rf /tmp/burst; mkdir /tmp/burst
          for i in $(seq 1 30); do
            curl -s -o /dev/null -w '%{http_code}\n' -X POST http://localhost:8082/api/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"burstuser","password":"wrong-guess-'"$i"'"}' \
              > "/tmp/burst/$i" &
          done
          wait
          n401=$(cat /tmp/burst/* | grep -c '^401$' || true)
          n429=$(cat /tmp/burst/* | grep -c '^429$' || true)
          nother=$(cat /tmp/burst/* | grep -vc '^401$\|^429$' || true)
          echo "concurrent burst: $n401 real checks (401), $n429 turned away (429), $nother other"
          [ "$nother" = "0" ] && echo "ok   every concurrent request got a clean 401 or 429, nothing else" || { echo "FAIL unexpected status codes in the burst"; docker logs rb3 | tail -30; exit 1; }
          [ "$n401" -le 5 ] && echo "ok   at most 5 of 30 concurrent guesses got a real password check ($n401)" || { echo "FAIL the lockout let $n401 of 30 concurrent guesses through (want <= 5)"; docker logs rb3 | tail -30; exit 1; }
          # The real password must still work once the lockout window is respected — i.e. the
          # account itself is intact and not corrupted by the burst, even while still locked.
          c=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8082/api/auth/login \
            -H 'Content-Type: application/json' -d '{"username":"burstuser","password":"the real password 123"}')
          [ "$c" = "429" ] && echo "ok   still locked right after the burst, even for the real password ($c)" || { echo "FAIL expected still-locked (429), got $c"; exit 1; }
          docker logs rb3 | tail -20

      - name: Attack — header injection via request-supplied strings
        run: |
          set -eu
          B=http://localhost:8080
          H=$(curl -si -X POST "$B/api/auth/login" -H 'Content-Type: application/json' \
            -d '{"username":"evil\r\nX-Injected: yes","password":"whatever-wrong"}')
          if printf '%s' "$H" | grep -qi '^X-Injected:'; then
            echo "FAIL CRLF in request body reached a response header"; exit 1
          fi
          echo "ok   no header injection via JSON body fields"

      - name: Container log
        if: always()
        run: docker logs rb || true
        continue-on-error: true
      - name: Container 2 log
        if: always()
        run: docker logs rb2 || true
        continue-on-error: true
      - name: Container 3 log
        if: always()
        run: docker logs rb3 || true
        continue-on-error: true
