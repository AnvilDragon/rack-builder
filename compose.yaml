# TrueNAS: Apps > Discover Apps > (three dots) > Install via YAML
# One container runs Rack Builder (/rack/) and HRT Log (/hrt/) behind one login.
# Change /mnt/POOL/apps/rack-builder to your dataset. Open http://<NAS IP>:30251
#
# https-proxy terminates a LAN-only self-signed HTTPS at https://<NAS IP>:30252. Push
# notifications (and anything else requiring a secure context) need this: browsers
# refuse Service Workers and the Push API on plain HTTP except on localhost. The first
# visit to the HTTPS port shows a "not secure" warning in every browser/device until you
# click through it once — expected for a self-signed cert with no public domain. Cookies
# set over :30252 get the Secure flag automatically (server.js reads the proxy's
# X-Forwarded-Proto header); the plain :30251 port keeps working unchanged alongside it,
# they just don't share a session (a browser won't send a Secure cookie over plain HTTP).
services:
  rack-builder:
    image: ghcr.io/anvildragon/rack-builder:latest
    pull_policy: always   # the image is public: Restart in TrueNAS always fetches the current `latest`, no manual Pull Image step
    container_name: rack-builder
    restart: unless-stopped
    environment:
      - DOCKER_HOST_PROXY=socket-proxy:2375   # live per-app stats; remove with the socket-proxy service to turn off
      - LIVE_INTERVAL=1   # seconds between updates. This polls every container's stats from Docker every
                           # LIVE_INTERVAL seconds regardless of whether anyone has the page open — most of a
                           # NAS's "always-on" live-stats network traffic comes from this, not the browser. 3-5s
                           # still feels live and cuts that traffic proportionally; raise it if that matters more
                           # than second-by-second graphs.
      - COOKIE_SECURE=0   # set to 1 if you only reach it over HTTPS (reverse proxy)
      - PRICES_TOKEN=paste-your-read-only-token-here   # weekly prices from the repo; leave as-is to turn off
      - VAPID_CONTACT=mailto:your-real-address@example.com   # shot-day push notifications: Safari/iOS
                                                               # specifically checks this is a real, reachable
                                                               # contact and rejects a placeholder outright
                                                               # (403 BadJwtToken) - Firefox/Chrome don't care.
                                                               # Put a mailto: or https: contact you actually
                                                               # control here, or Safari/iOS reminders won't work.
    ports:
      - "30251:8080"
    volumes:
      - /mnt/POOL/apps/rack-builder:/data
    user: "568:568"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - socket-proxy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Self-signed HTTPS for the LAN, reached by raw IP (no hostname, so no SNI). A bare
  # "tls internal" with no "on_demand" never actually issues a certificate for a site with
  # no declared hostname — confirmed via debug logging: "no certificate matching TLS
  # ClientHello", "on_demand":false. "on_demand" scoped inside this site's own tls block
  # tells Caddy to issue a cert from the internal CA reactively, per connection, regardless
  # of what identity (or lack of SNI) the client presents — the right fit for "anyone on the
  # LAN, connecting by IP, no DNS." Caddy keeps its local CA (so the cert, and the
  # certificates it issues, survive restarts) as long as /data below stays around — losing
  # it means a new CA, and a new browser trust prompt on every device.
  #
  # /root.mobileconfig: serving the bare CA certificate (even with the right MIME type)
  # downloads fine on iOS but fails to install with "Invalid Profile" - confirmed live.
  # iOS's fully-supported path is a proper Apple Configuration Profile: an XML plist with
  # specific required keys (PayloadType, PayloadUUID, etc.) wrapping the certificate as
  # base64 DER, served as application/x-apple-aspen-config. A CA's root certificate is
  # public info by design (nothing like a private key), so serving it with no auth is fine.
  # Without installing it as a trusted profile, the phone only trusts the cert inside the
  # interactive Safari tab you clicked through - background fetches a home-screen web app
  # makes (including its own icon) hit the same untrusted cert outside that exception and
  # fail silently, which is why a PWA added to the home screen can show a broken icon or
  # stop working even though the page loads fine in the browser.
  https-proxy:
    image: caddy:2-alpine
    container_name: rack-builder-https
    restart: unless-stopped
    # A single command STRING here relies on whatever's deploying this correctly splitting
    # it into argv the way a shell would — manually running the exact same command inside
    # the container worked perfectly, but set as the container's actual entrypoint it
    # crash-looped immediately, which is consistent with a naive whitespace-based split
    # (TrueNAS's "Install via YAML" doesn't run this through real docker-compose — it
    # translates into Kubernetes resources, and that layer may not respect shell quoting).
    # A YAML list removes all ambiguity: each argv element is explicit no matter what
    # processes this file. The script itself (this one list item) was tested end to end
    # locally first: generated a test cert, ran it through this exact logic, and confirmed
    # the embedded base64 data decodes back to a valid certificate and the XML is well-formed.
    command:
      - sh
      - -c
      - |
        (
          apk add --no-cache openssl >/dev/null 2>&1
          while [ ! -s /data/pki/authorities/local/root.crt ]; do sleep 1; done
          DER=$(openssl x509 -in /data/pki/authorities/local/root.crt -outform der | base64 -w0)
          UUID1=$(cat /proc/sys/kernel/random/uuid)
          UUID2=$(cat /proc/sys/kernel/random/uuid)
          cat > /data/root.mobileconfig <<PROFILE
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
        <key>PayloadContent</key>
        <array>
        <dict>
        <key>PayloadCertificateFileName</key>
        <string>root.cer</string>
        <key>PayloadContent</key>
        <data>$DER</data>
        <key>PayloadDescription</key>
        <string>Adds a trusted CA root certificate for Rack Builder / HRT Log</string>
        <key>PayloadDisplayName</key>
        <string>Rack Builder Local CA</string>
        <key>PayloadIdentifier</key>
        <string>com.apple.security.root.$UUID1</string>
        <key>PayloadType</key>
        <string>com.apple.security.root</string>
        <key>PayloadUUID</key>
        <string>$UUID1</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
        </dict>
        </array>
        <key>PayloadDisplayName</key>
        <string>Rack Builder Local CA</string>
        <key>PayloadIdentifier</key>
        <string>com.rackbuilder.localca</string>
        <key>PayloadUUID</key>
        <string>$UUID2</string>
        <key>PayloadType</key>
        <string>Configuration</string>
        <key>PayloadVersion</key>
        <integer>1</integer>
        </dict>
        </plist>
        PROFILE
        ) &
        printf '%s\n' '{' '  debug' '}' ':8443 {' '  tls internal {' '    on_demand' '  }' '  handle /root.mobileconfig {' '    header Content-Type application/x-apple-aspen-config' '    root * /data' '    file_server' '  }' '  reverse_proxy rack-builder:8080' '}' > /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "30252:8443"
    volumes:
      - /mnt/POOL/apps/rack-builder/caddy:/data
    depends_on:
      - rack-builder
    deploy:
      resources:
        limits:
          cpus: "0.10"
          # 64M was tight enough to OOM-kill Caddy on first run, silently, right after a
          # clean startup log — its Go runtime plus TLS cert generation needs more room.
          memory: 128M

  # Read-only window into Docker: lists containers and their stats only. Cannot start, stop or change anything.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: rack-builder-socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 32M

x-portals:
  - name: Rack Builder
    scheme: http
    host: 0.0.0.0   # TrueNAS fills in the address you opened the app from
    port: 30251
    path: /
  - name: Rack Builder (HTTPS)
    scheme: https
    host: 0.0.0.0
    port: 30252
    path: /
